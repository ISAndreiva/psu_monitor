<html lang="en">
{% load static %}
<link rel="stylesheet" href="{% static 'psu/style.css' %}">
<head>
    <title>PSU Monitor</title>
</head>
<body>
    <img src="{% static 'psu/images/logo.png' %}" alt="Logo" style="width: 200px; height: 155px;" class="center">
    {% if psu_list %}
    <main id="psus">
    {% for psu in psu_list %}
        <div id="psu-{{ psu.pk }}">
            <h2>{{ psu }}</h2>
            <p>Voltage IN: <span id="voltageIN-{{ psu.pk }}"></span></p>
            <p>Current IN: <span id="currentIN-{{ psu.pk }}"></span></p>
            <p>Power IN: <span id="powerIN-{{ psu.pk }}"></span></p>
            <p>Voltage OUT: <span id="voltageOUT-{{ psu.pk }}"></span></p>
            <p>Current OUT: <span id="currentOUT-{{ psu.pk }}"></span></p>
            <p>Power OUT: <span id="powerOUT-{{ psu.pk }}"></span></p>
            <p>Efficiency: <span id="efficiency-{{ psu.pk }}"></span></p>
            <p>Temperature 1: <span id="temperature1-{{ psu.pk }}"></span></p>
            <p>Temperature 2: <span id="temperature2-{{ psu.pk }}"></span></p>
            <p>Temperature 3: <span id="temperature3-{{ psu.pk }}"></span></p>
            <p>Fan Speed: <span id="fan_speed-{{ psu.pk }}"></span></p>
        </div>
        <script>
            function updatePSUData(psuId) {
                fetch(`/get_psu/${psuId}`)
                    .then(response => response.json())
                    .then(data => {
                        var date = new Date(0);
                        date.setUTCSeconds(data.last_updated);
                        if (date.getTime() > Date.now() - 10000) {
                            document.getElementById(`voltageIN-${psuId}`).innerText = data.voltageIN;
                            document.getElementById(`currentIN-${psuId}`).innerText = data.currentIN;
                            document.getElementById(`powerIN-${psuId}`).innerText = data.powerIN;
                            document.getElementById(`voltageOUT-${psuId}`).innerText = data.voltageOUT;
                            document.getElementById(`currentOUT-${psuId}`).innerText = data.currentOUT;
                            document.getElementById(`powerOUT-${psuId}`).innerText = data.powerOUT;
                            document.getElementById(`efficiency-${psuId}`).innerText = data.efficiency;
                            document.getElementById(`temperature1-${psuId}`).innerText = data.temperature1;
                            document.getElementById(`temperature2-${psuId}`).innerText = data.temperature2;
                            document.getElementById(`temperature3-${psuId}`).innerText = data.temperature3;
                            document.getElementById(`fan_speed-${psuId}`).innerText = data.fan_speed;
                        } else {
                            document.getElementById(`voltageIN-${psuId}`).innerText = "Loading...";
                            document.getElementById(`currentIN-${psuId}`).innerText = "Loading...";
                            document.getElementById(`powerIN-${psuId}`).innerText = "Loading...";
                            document.getElementById(`voltageOUT-${psuId}`).innerText = "Loading...";
                            document.getElementById(`currentOUT-${psuId}`).innerText = "Loading...";
                            document.getElementById(`powerOUT-${psuId}`).innerText = "Loading...";
                            document.getElementById(`efficiency-${psuId}`).innerText = "Loading...";
                            document.getElementById(`temperature1-${psuId}`).innerText = "Loading...";
                            document.getElementById(`temperature2-${psuId}`).innerText = "Loading...";
                            document.getElementById(`temperature3-${psuId}`).innerText = "Loading...";
                            document.getElementById(`fan_speed-${psuId}`).innerText = "Loading...";
                        }

                    });
            }

            updatePSUData('{{ psu.pk }}');
            setInterval(() => {
                    updatePSUData('{{ psu.pk }}');
            }, 1000);

        </script>
        {% endfor %}
    </main>
    {% else %}
    <p>No PSU are available.</p>
    {% endif %}
</body>
</html>
